# Pre-commit hooks for the mortgage_dashboard repo.
#
# One-time setup (requires the pre-commit framework):
#   backend\venv\Scripts\pip install pre-commit
#   backend\venv\Scripts\pre-commit install
#
# Then hooks run automatically on `git commit`. To run on demand across all files:
#   backend\venv\Scripts\pre-commit run --all-files
#
# If you prefer not to use the framework, deploy\scan.ps1 runs the same scanners
# directly against the backend venv.

exclude: '^(backend/venv/|frontend/node_modules/|frontend/dist/|backend/txn_data/|.*\.enc$)'

repos:
  # Baseline hygiene: block accidental large files, fix whitespace, validate config.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json
        # tsconfig.*.json are JSONC (TypeScript allows comments + trailing
        # commas), which the strict JSON parser rejects. .secrets.baseline is
        # managed by detect-secrets, not hand-edited.
        exclude: '^(\.secrets\.baseline|frontend/tsconfig\..*\.json)$'
      - id: detect-private-key

  # Secret scanning against the committed baseline (baseline currently has zero
  # findings; any NEW secret fails the commit).
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: '^(frontend/package-lock\.json|\.secrets\.baseline)$'

  # Python lint + security anti-patterns (ruff includes flake8-bandit "S" rules).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        files: '^backend/.*\.py$'
        args: ['--config', 'backend/pyproject.toml']

  # Python SAST (deeper than ruff's S rules for some checks).
  - repo: https://github.com/PyCQA/bandit
    rev: '1.7.10'
    hooks:
      - id: bandit
        files: '^backend/.*\.py$'
        args: ['-c', 'backend/pyproject.toml']
        additional_dependencies: ['bandit[toml]']
